spring.application.name=biblioteca-virtual

# ===== Banco de dados (MySQL) =====
# As credenciais vêm de variáveis de ambiente (DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD).
# O valor depois dos dois-pontos é só o padrão do banco local do docker-compose.yml,
# para o projeto subir sem configuração extra em desenvolvimento.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biblioteca_virtual}
spring.datasource.username=${DB_USERNAME:biblioteca}
spring.datasource.password=${DB_PASSWORD:biblioteca}

# ===== JPA / Hibernate =====
# As tabelas são criadas somente pelas migrations do Flyway; o Hibernate apenas confere
# se as entidades batem com o banco e falha na subida se algo estiver diferente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== Flyway =====
# Cada pessoa usa uma faixa de versões (V10+, V20+, V30+). Com out-of-order, uma migration
# de número menor que chegue na main depois de outra maior ainda é aplicada.
spring.flyway.out-of-order=true

# ===== Swagger (springdoc-openapi) =====
springdoc.swagger-ui.path=/swagger-ui.html
# Mostra em cada rota só as respostas documentadas nela (sem herdar todas as do GlobalExceptionHandler).
springdoc.override-with-generic-response=false
